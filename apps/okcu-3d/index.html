<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Sallanan Okçular 3D</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d1018; overflow: hidden; }
      /* The stage keeps the game's 9:16 logical frame; everything (canvas and DOM overlay) lives inside it. */
      #stage { position: relative; height: 100%; aspect-ratio: 9 / 16; max-width: 100%; margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; }
      #stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #overlay { position: absolute; inset: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="overlay"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
