name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The runner has no preinstalled browser; install the Chromium matching the pinned
      # @playwright/test version (locally the gate uses the machine's preinstalled one).
      - run: npx playwright install --with-deps chromium
      - run: npm run gate
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: games/*/tests/artifacts/*.png
          if-no-files-found: ignore
